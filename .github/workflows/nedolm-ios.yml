name: Mercan iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'refactor/**'
    tags:
      - 'ios-v*'
    paths:
      - '.github/workflows/nedolm-ios.yml'
      - 'ios-app/**'
      - 'scripts/build-nedolm-llama-ios.sh'
      - 'runtime/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Mercan iOS frameworks
        run: |
          chmod +x ios-app/scripts/*.sh
          ios-app/scripts/prepare-frameworks.sh

      - name: Build unsigned validation IPA
        run: ios-app/scripts/build-unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mercan-iOS-unsigned-IPA
          path: build/ios/Mercan-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Import Apple distribution certificate
        if: ${{ vars.ENABLE_TESTFLIGHT == 'true' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        if: ${{ vars.ENABLE_TESTFLIGHT == 'true' }}
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ vars.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive signed App Store build
        if: ${{ vars.ENABLE_TESTFLIGHT == 'true' }}
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          IOS_MARKETING_VERSION: 0.1.0
        run: ios-app/scripts/archive-appstore.sh

      - name: Upload signed IPA artifact
        if: ${{ vars.ENABLE_TESTFLIGHT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Mercan-iOS-AppStore-IPA
          path: build/ios/Mercan-AppStore.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ vars.ENABLE_TESTFLIGHT == 'true' }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/Mercan-AppStore.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'
          backend: AppStoreAPI
